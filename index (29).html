<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AI Signal Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #050505;
            color: #00ff41;
            overflow: hidden; /* Prevent scrolling */
            /* Grid background for tech feel */
            background-image: 
                linear-gradient(rgba(0, 255, 65, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 65, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            
            /* iOS Safe Areas */
            padding-top: max(env(safe-area-inset-top), 20px);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        .cyber-font {
            font-family: 'Orbitron', sans-serif;
        }
        .scanner-line {
            position: absolute;
            width: 100%;
            height: 4px;
            background: #00f3ff;
            box-shadow: 0 0 15px #00f3ff;
            animation: scan 0.8s infinite linear; /* Super Fast scan animation */
            top: 0;
            z-index: 10;
        }
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .video-container {
            position: relative;
            overflow: hidden;
            border: 1px solid #333;
            background: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .hud-corner {
            position: absolute;
            width: 20px; /* Smaller corners for smaller view */
            height: 20px;
            border: 2px solid #00ff41;
            z-index: 5;
            opacity: 0.8;
        }
        .tl { top: 5px; left: 5px; border-right: 0; border-bottom: 0; }
        .tr { top: 5px; right: 5px; border-left: 0; border-bottom: 0; }
        .bl { bottom: 5px; left: 5px; border-right: 0; border-top: 0; }
        .br { bottom: 5px; right: 5px; border-left: 0; border-top: 0; }
        
        .btn-generate {
            background: linear-gradient(45deg, #0066ff, #00ccff);
            border: none;
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 204, 255, 0.3);
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent; /* Remove grey tap box on iOS */
        }
        
        .btn-generate:active {
            transform: scale(0.96);
        }

        .btn-generate:disabled {
            filter: grayscale(100%);
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(1);
        }
        
        .signal-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
            flex-grow: 1; /* Take up all available space */
        }

        .signal-circle {
            width: 320px; /* MASSIVE SIZE */
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            border: 8px solid #222; /* Thicker border */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(0,0,0,0.9), inset 0 0 40px rgba(0,0,0,0.9);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 10;
        }

        .signal-value {
            font-size: 6.5rem; /* HUGE FONT */
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255,255,255,0.4);
            transition: all 0.3s;
            line-height: 0.9;
            letter-spacing: -2px;
        }

        .signal-label {
            font-size: 1rem;
            color: #888;
            letter-spacing: 4px;
            margin-top: 10px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* Active State for Signal */
        .signal-active {
            border-color: #00ff41;
            box-shadow: 0 0 60px rgba(0, 255, 65, 0.5), inset 0 0 40px rgba(0, 255, 65, 0.3);
            animation: pulse-green 2s infinite;
        }
        .signal-active .signal-value {
            color: #fff;
            text-shadow: 0 0 30px #00ff41;
            transform: scale(1.05);
        }
        .signal-active .signal-label {
            color: #00ff41;
        }

        .signal-high {
            border-color: #ff0055;
            box-shadow: 0 0 70px rgba(255, 0, 85, 0.6), inset 0 0 40px rgba(255, 0, 85, 0.3);
            animation: pulse-red 1s infinite;
        }
        .signal-high .signal-value {
            color: #fff;
            text-shadow: 0 0 30px #ff0055;
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 60px rgba(0, 255, 65, 0.5); }
            50% { box-shadow: 0 0 80px rgba(0, 255, 65, 0.7); }
            100% { box-shadow: 0 0 60px rgba(0, 255, 65, 0.5); }
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 70px rgba(255, 0, 85, 0.6); }
            50% { box-shadow: 0 0 100px rgba(255, 0, 85, 0.8); }
            100% { box-shadow: 0 0 70px rgba(255, 0, 85, 0.6); }
        }

        /* Fake Graph */
        .graph-line {
            fill: none;
            stroke: #00ff41;
            stroke-width: 2;
            opacity: 0.5;
        }

        .confidence-badge {
            position: absolute;
            bottom: -22px;
            background: #000;
            border: 2px solid #333;
            color: #888;
            padding: 5px 18px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
            z-index: 20;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        .confidence-active {
            border-color: #00ff41;
            color: #00ff41;
            box-shadow: 0 0 15px rgba(0,255,65,0.4);
            background: #051a05;
        }

        /* Custom flashing animation for the link button */
        @keyframes flash-red {
            0%, 100% { background-color: #dc2626; box-shadow: 0 0 10px #dc2626; }
            50% { background-color: #ef4444; box-shadow: 0 0 20px #ef4444; }
        }
        .btn-flash {
            animation: flash-red 1.5s infinite;
        }

    </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col p-4">

    <header class="flex justify-between items-center mb-1 border-b border-gray-800 pb-2 shrink-0">
        <div class="flex items-center gap-2">
            <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" />
            <h1 class="text-xl cyber-font font-bold text-white tracking-widest">PREDICTOR<span class="text-blue-500">AI</span></h1>
        </div>
        <div class="flex items-center gap-2">
            <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
            <span class="text-xs text-gray-400 font-mono">ONLINE</span>
        </div>
    </header>

    <div class="video-container rounded-2xl h-[12vh] w-full mb-1 relative bg-gray-900 shrink-0">
        <video id="camera-feed" autoplay playsinline muted class="w-full h-full object-cover opacity-60"></video>
        
        <div class="scanner-line hidden" id="scanner"></div>
        <div class="hud-corner tl"></div>
        <div class="hud-corner tr"></div>
        <div class="hud-corner bl"></div>
        <div class="hud-corner br"></div>
        
        <svg class="absolute bottom-0 left-0 w-full h-full opacity-30" preserveAspectRatio="none">
            <path id="graph-path" class="graph-line" d="M0,50 L10,50 L20,50 L30,50 L40,50 L50,50 L60,50 L70,50 L80,50 L90,50 L100,50" />
        </svg>

        <div class="absolute top-1 right-2 bg-black/60 px-2 py-0.5 rounded border border-gray-700">
            <div class="text-[9px] text-blue-400 font-mono">AI V.5.0</div>
        </div>
        
        <div id="scanning-text" class="absolute inset-0 flex items-center justify-center hidden bg-black/40 backdrop-blur-sm">
            <div class="text-center">
                <div class="text-cyan-400 text-sm font-bold cyber-font tracking-widest animate-pulse" id="scan-status-text">SCANNING...</div>
            </div>
        </div>
    </div>

    <div class="flex-grow flex flex-col items-center justify-center relative w-full">
        
        <div class="signal-container w-full">
            <div class="absolute w-[360px] h-[360px] border border-gray-800 rounded-full animate-spin-slow opacity-30"></div>
            <div class="absolute w-[340px] h-[340px] border border-dashed border-gray-700 rounded-full opacity-30" style="transform: rotate(-45deg)"></div>
            
            <div id="signal-display" class="signal-circle">
                <span id="signal-value" class="signal-value cyber-font">0.00x</span>
                <span class="signal-label">MULTIPLIER</span>
                <div id="confidence-badge" class="confidence-badge">READY</div>
            </div>
        </div>

        <div class="w-64 h-1.5 bg-gray-800 rounded-full overflow-hidden absolute bottom-4 opacity-0 transition-opacity" id="progress-container">
            <div id="progress-bar" class="h-full bg-blue-500 w-0 transition-all duration-100 ease-out"></div>
        </div>

    </div>

    <div class="h-6 w-full bg-black/40 border-t border-b border-gray-800 px-2 flex items-center font-mono text-[9px] text-gray-500 overflow-hidden mb-2 relative shrink-0">
        <div class="text-green-500 mr-2">&gt;</div>
        <div id="terminal-last-line" class="text-gray-400">System Ready.</div>
    </div>

    <div class="w-full mb-3 shrink-0 px-1">
        <a href="https://reffpa.com/L?tag=d_5572400m_97c_&site=5572400&ad=97" target="_blank" class="block w-full py-2.5 rounded-xl text-center text-white font-black text-sm tracking-[0.2em] btn-flash border border-red-500 uppercase cyber-font shadow-lg transform active:scale-95 transition-transform no-underline">
            ⚠️ WORKS ONLY HERE ⚠️
        </a>
    </div>

    <div class="w-full shrink-0 pb-2">
        <button onclick="runPredictionProcess()" id="main-btn" class="w-full btn-generate h-16 rounded-2xl flex items-center justify-center gap-3 shadow-lg group">
            <div class="relative">
                <div class="absolute -inset-1 bg-white rounded-full opacity-20 group-hover:animate-ping"></div>
                <svg class="w-8 h-8 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" />
            </div>
            <div class="text-left">
                <div class="text-2xl font-black cyber-font tracking-wider">PREDICT</div>
                <div class="text-[10px] opacity-80 font-mono tracking-widest">TAP TO ANALYZE</div>
            </div>
        </button>
    </div>

    <script>
        // Camera Setup
        const video = document.getElementById('camera-feed');
        async function initCamera() {
            try {
                const constraints = {
                    video: { 
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
            } catch (err) {
                console.log("Cam fallback", err);
                video.poster = "https://placehold.co/400x150/000000/111111?text=DATA+STREAM";
            }
        }
        window.addEventListener('load', initCamera);

        // Elements
        const terminalLine = document.getElementById('terminal-last-line');
        const scanner = document.getElementById('scanner');
        const scanningOverlay = document.getElementById('scanning-text');
        const scanStatusText = document.getElementById('scan-status-text');
        const mainBtn = document.getElementById('main-btn');
        const signalDisplay = document.getElementById('signal-display');
        const signalValue = document.getElementById('signal-value');
        const confBadge = document.getElementById('confidence-badge');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const graphPath = document.getElementById('graph-path');

        let isProcessing = false;
        let clickCount = 0; // Fixed sequence logic

        function log(msg) {
            terminalLine.innerText = msg;
            terminalLine.classList.remove('text-gray-400');
            terminalLine.classList.add('text-green-400');
            setTimeout(() => {
                terminalLine.classList.remove('text-green-400');
                terminalLine.classList.add('text-gray-400');
            }, 300);
        }

        // Animate fake graph
        setInterval(() => {
            if (graphPath) {
                let d = "M0,50 ";
                for(let i=10; i<=100; i+=10) {
                    d += `L${i},${10 + Math.random()*80} `; // More volatile graph for small height
                }
                graphPath.setAttribute('d', d);
            }
        }, 300);

        function runPredictionProcess() {
            if(isProcessing) return;
            isProcessing = true;
            
            // 1. Lock UI
            mainBtn.disabled = true;
            resetSignalDisplay();
            
            // 2. Start Scanning (Visuals)
            log("Scanning visual data...");
            scanner.classList.remove('hidden');
            scanningOverlay.classList.remove('hidden');
            scanStatusText.innerText = "SCANNING...";
            
            // Haptic start
            if(navigator.vibrate) navigator.vibrate(50);

            // 3. After 0.5 second (ULTRA FAST), switch to Analysis
            setTimeout(() => {
                scanStatusText.innerText = "ANALYZING...";
                log("Decrypting pattern...");
                
                // Small vibration
                if(navigator.vibrate) navigator.vibrate([30,30]);
            }, 500);

            // 4. After 0.9 seconds total (ULTRA FAST), Stop Scan and Start Generation
            setTimeout(() => {
                scanner.classList.add('hidden');
                scanningOverlay.classList.add('hidden');
                startGenerationAnimation();
            }, 900);
        }

        function resetSignalDisplay() {
            signalDisplay.className = "signal-circle";
            signalValue.innerText = "0.00x";
            signalValue.style.color = "#ffffff";
            confBadge.className = "confidence-badge";
            confBadge.innerText = "PROCESSING";
        }

        function startGenerationAnimation() {
            progressContainer.classList.remove('opacity-0');
            log("Calculating...");

            let w = 0;
            const int = setInterval(() => {
                w += 10; // Ultra speed
                progressBar.style.width = w + "%";
                if(w >= 100) {
                    clearInterval(int);
                    showFinalResult();
                }
            }, 20); 
        }

        function showFinalResult() {
            progressContainer.classList.add('opacity-0');
            progressBar.style.width = "0%";
            
            let val, isHigh = false;

            // ЛОГИКА РАНДОМА (БЕЗ ФИКСИРОВАННЫХ ЗНАЧЕНИЙ)
            const r = Math.random();
            if(r < 0.90) {
                // 90% вероятность: 1.10 - 1.90
                val = (1.10 + Math.random() * 0.80).toFixed(2); 
            } else {
                // 10% вероятность: 2.00 - 5.00
                val = (2.00 + Math.random() * 3.00).toFixed(2); 
                isHigh = true; // Высокий сигнал подсвечиваем
            }

            const confidence = (94 + Math.random() * 5).toFixed(1); 

            // Animate Numbers
            let count = 1.00;
            const targetVal = parseFloat(val);
            // Ultra step size for instant counting
            const step = targetVal > 10 ? 2.5 : 0.35; 
            
            const spin = setInterval(() => {
                count += step;
                if (Math.random() > 0.8) count += step * 2;

                if(count >= targetVal) {
                    count = targetVal;
                    clearInterval(spin);
                    finalizeSignal(val, isHigh, confidence);
                }
                signalValue.innerText = Number(count).toFixed(2) + "x";
            }, 15); // Faster Interval
        }

        function finalizeSignal(val, isHigh, conf) {
            signalValue.innerText = val + "x";
            
            if(isHigh) {
                signalDisplay.classList.add('signal-high');
                confBadge.style.color = "#ff0055";
                confBadge.style.borderColor = "#ff0055";
            } else {
                signalDisplay.classList.add('signal-active');
                confBadge.classList.add('confidence-active');
            }

            confBadge.innerText = `ACCURACY: ${conf}%`;
            log(`Prediction: ${val}x`);
            
            if(navigator.vibrate) navigator.vibrate(isHigh ? [100,50,100,50,100] : 100);

            setTimeout(() => {
                mainBtn.disabled = false;
                isProcessing = false;
                log("Ready.");
                confBadge.innerText = "READY";
            }, 1500); // Reduced cooldown to 1.5s
        }
    </script>
</body>
</html>
